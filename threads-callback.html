<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Threads認証コード</title>
<style>
  body { font-family: sans-serif; background: #faf7f2; color: #333; margin: 0; padding: 24px 16px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; }
  textarea { width: 100%; box-sizing: border-box; height: 120px; font-family: monospace; font-size: 14px; padding: 8px; }
  button { margin-top: 12px; padding: 10px 20px; font-size: 16px; border: 0; border-radius: 6px; background: #7a9a7e; color: #fff; cursor: pointer; }
  p.note { font-size: 13px; color: #666; }
</style>
</head>
<body>
<main>
  <h1>Threads 認証コード</h1>
  <p id="msg">下のコードをコピーして、PCの認証画面（黒い画面）に貼り付けてください。</p>
  <textarea id="code" readonly></textarea>
  <button id="copy" type="button">コードをコピー</button>
  <p class="note">このコードは数分で使えなくなります。Claudeのチャットには貼らないでください。</p>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var code = (q.get("code") || "").replace(/#_$/, "");
  var box = document.getElementById("code");
  if (code) { box.value = code; }
  else {
    document.getElementById("msg").textContent = q.get("error_description") || "コードがありません。もう一度、認証をやり直してください。";
    document.getElementById("copy").style.display = "none";
  }
  document.getElementById("copy").onclick = function () {
    box.select();
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).catch(function () { document.execCommand("copy"); });
    this.textContent = "コピーしました";
  };
</script>
</body>
</html>
